spring:
  application:
    name: lti-tool-manager
  config.import: optional:${app.fullFilePath}/${app.overridesFileName}, optional:${app.fullFilePath}/security.properties, classpath:canvas.properties, optional:classpath:git.properties, optional:classpath:email.properties, classpath:lti-registrations.properties
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        boot:
          allow_jdbc_metadata_access: false
      jadira:
        usertype:
          autoRegisterUserTypes: true
  datasource:
    url: ${lms.db.url}
    username: ${lms.db.user}
    password: ${lms.db.password}
    type: ${lms.db.poolType}
  cloud.vault.enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${oauth.tokenprovider.url}/.well-known/jwks.json
      client:
        registration:
          lms_canvas_oauth2_ltitoolmanager:
            client-id: ${canvas.oauth2.clientId}
            client-secret: ${canvas.oauth2.clientSecret}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - url:GET|/api/v1/courses/:course_id/external_tools
              - url:DELETE|/api/v1/courses/:course_id/external_tools/:external_tool_id
        provider:
          lms_canvas_oauth2_ltitoolmanager:
            authorization-uri: ${canvas.baseUrl}/login/oauth2/auth
            token-uri: ${canvas.baseUrl}/login/oauth2/token
  web.error.whitelabel.enabled: false

canvas:
  oauth2:
    enabled: true
    clientId: ${canvas.oauth2.clientId.ltitoolmanager}
    clientSecret: ${canvas.oauth2.clientSecret.ltitoolmanager}
lti-tool-manager:
  version: @app.version@
  env: ${app.env}

server:
  servlet:
    session:
      timeout: 30m

app:
  env: dev
  fullFilePath: file:/usr/src/app/config
  overridesFileName: overrides.properties

management:
  endpoint.lms.enabled: true
  endpoints.web.exposure.include: health,lms
  health.redis.enabled: false
  info.java.enabled: true

springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false

---
spring:
  config.activate.on-profile: redis-session
  session.data.redis.namespace: lti-tool-manager-@app.version@:session
management.health.redis.enabled: true

---

spring:
  config:
    activate.on-profile: vault
    import: vault://
  cloud.vault:
    enabled: true
    config:
      lifecycle.lease-endpoints: leases
    generic:
      enabled: false
    kv:
      enabled: true
      backend: ua-vpit/enterprise-systems/lms/kv
      application-name: lti-tool-manager

---

spring:
  config:
    activate.on-profile: swagger
springdoc:
  api-docs:
    enabled: true
    path: /api/v3/api-docs
  cache.disabled: true
  packagesToScan: edu.iu.uits.lms.ltitoolmanager.rest
  swagger-ui:
    enabled: false
    disable-swagger-default-url: true
    path: /api/swagger-ui.html
    # Setting supportedSubmitMethods to an empty list is what turns off the "try it out" button
    #    supportedSubmitMethods:
    oauth:
      clientId: ${oauth.tokenprovider.clientId}
  oAuthFlow:
    authorizationUrl: ${oauth.tokenprovider.url}/oauth/authorize
    tokenUrl: ${oauth.tokenprovider.accessTokenUri}
